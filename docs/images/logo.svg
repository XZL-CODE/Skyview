<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea"/>
      <stop offset="100%" style="stop-color:#fed6e3"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#skyGradient)"/>

  <!-- 眼睛/监控图标 -->
  <ellipse cx="64" cy="64" rx="36" ry="24" fill="none" stroke="white" stroke-width="4"/>
  <circle cx="64" cy="64" r="14" fill="white"/>
  <circle cx="64" cy="64" r="8" fill="url(#skyGradient)"/>

  <!-- 光芒/数据流 -->
  <path d="M64 28 L64 36" stroke="url(#glowGradient)" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 92 L64 100" stroke="url(#glowGradient)" stroke-width="3" stroke-linecap="round"/>
  <path d="M28 64 L20 64" stroke="url(#glowGradient)" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 64 L108 64" stroke="url(#glowGradient)" stroke-width="3" stroke-linecap="round"/>

  <!-- 对角光芒 -->
  <path d="M38 38 L32 32" stroke="url(#glowGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M90 38 L96 32" stroke="url(#glowGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M38 90 L32 96" stroke="url(#glowGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M90 90 L96 96" stroke="url(#glowGradient)" stroke-width="2" stroke-linecap="round"/>
</svg>
