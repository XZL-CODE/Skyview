<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fc4a1a"/>
      <stop offset="100%" style="stop-color:#f7b733"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="700" height="300" fill="#1a1a2e" rx="12"/>

  <!-- 标题 -->
  <text x="350" y="35" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">应用架构</text>

  <!-- Views 层 -->
  <rect x="50" y="60" width="180" height="180" rx="10" fill="url(#blueGrad)" opacity="0.9"/>
  <text x="140" y="90" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Views 视图层</text>

  <rect x="70" y="105" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="140" y="122" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Dashboard</text>

  <rect x="70" y="140" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="140" y="157" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Cards</text>

  <rect x="70" y="175" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="140" y="192" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Components</text>

  <rect x="70" y="210" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="140" y="227" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Sidebar</text>

  <!-- 箭头1 -->
  <path d="M235 150 L255 150" stroke="#fff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#fff"/>
    </marker>
  </defs>

  <!-- Services 层 -->
  <rect x="260" y="60" width="180" height="180" rx="10" fill="url(#greenGrad)" opacity="0.9"/>
  <text x="350" y="90" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Services 服务层</text>

  <rect x="280" y="105" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="350" y="122" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">CPUMonitor</text>

  <rect x="280" y="140" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="350" y="157" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">MemoryMonitor</text>

  <rect x="280" y="175" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="350" y="192" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">NetworkMonitor</text>

  <rect x="280" y="210" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="350" y="227" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">...</text>

  <!-- 箭头2 -->
  <path d="M445 150 L465 150" stroke="#fff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Models 层 -->
  <rect x="470" y="60" width="180" height="180" rx="10" fill="url(#orangeGrad)" opacity="0.9"/>
  <text x="560" y="90" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Models 数据层</text>

  <rect x="490" y="105" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="560" y="122" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">CPUInfo</text>

  <rect x="490" y="140" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="560" y="157" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">MemoryInfo</text>

  <rect x="490" y="175" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="560" y="192" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">BatteryInfo</text>

  <rect x="490" y="210" width="140" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="560" y="227" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">...</text>

  <!-- 底部说明 -->
  <text x="350" y="275" fill="#888" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">SwiftUI + Combine 响应式架构</text>
</svg>
