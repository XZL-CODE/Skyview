name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild -project Skyview.xcodeproj \
            -scheme Skyview \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild -project Skyview.xcodeproj \
            -scheme Skyview \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO
